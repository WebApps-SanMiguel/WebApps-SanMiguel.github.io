<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#24483B">
  <title>Gestión Parroquial</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #19354A;
      background: #F7F6F1;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #24483B;
      color: #fff;
      padding: 16px 20px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.15);
    }

    header h1 {
      margin: 0;
      color: #D1B574;
      font-family: Georgia, serif;
      font-size: clamp(1.2rem, 4vw, 1.8rem);
    }

    header p {
      margin: 6px 0 0;
      font-size: 0.9rem;
      opacity: 0.9;
    }

    main {
      flex: 1;
      width: 100%;
      padding: 14px;
    }

    .app-frame {
      width: 100%;
      height: calc(100vh - 125px);
      min-height: 500px;
      overflow: hidden;
      background: #fff;
      border: 1px solid #e4e1d7;
      border-radius: 16px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.1);
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    footer {
      padding: 10px;
      color: #79543A;
      text-align: center;
      font-size: 0.8rem;
    }

    @media (max-width: 600px) {
      header {
        padding: 13px 12px;
      }

      main {
        padding: 8px;
      }

      .app-frame {
        height: calc(100vh - 105px);
        min-height: 400px;
        border-radius: 10px;
      }

      footer {
        display: none;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Gestión Parroquial</h1>
    <p>San Francisco de Asís</p>
  </header>

  <main>
    <div class="app-frame">
      <iframe
        src="PEGA_AQUI_LA_URL_DE_TU_APLICACION"
        title="Aplicación de Gestión Parroquial"
        allow="fullscreen"
        loading="lazy">
      </iframe>
    </div>
  </main>

  <footer>
    Gestión Parroquial
  </footer>
</body>
</html>
