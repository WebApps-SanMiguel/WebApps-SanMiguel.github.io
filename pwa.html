<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#174a35">

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <title>Mi Aplicación</title>

  <style>
    /* =====================================================
       REINICIO COMPLETO
       ===================================================== */

    * {
      box-sizing: border-box;
    }

    html {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #ffffff;
    }

    body {
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;

      margin: 0;
      padding: 0;

      overflow: hidden;

      background: #ffffff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    /* =====================================================
       CONTENEDOR PRINCIPAL
       ===================================================== */

    .app {
      position: fixed;

      top: 0;
      right: 0;
      bottom: 0;
      left: 0;

      width: 100vw;
      height: 100vh;

      width: 100dvw;
      height: 100dvh;

      margin: 0;
      padding: 0;

      overflow: hidden;

      background: #ffffff;
    }

    /* =====================================================
       IFRAME
       ===================================================== */

    .app iframe {
      display: block;

      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      min-width: 0;
      min-height: 0;

      margin: 0;
      padding: 0;

      border: 0;
      outline: 0;

      background: #ffffff;
    }

    /* =====================================================
       EVITA PROBLEMAS EN MÓVILES
       ===================================================== */

    @supports (height: 100svh) {
      .app {
        width: 100vw;
        height: 100svh;
      }

      .app iframe {
        width: 100vw;
        height: 100svh;
      }
    }

    @supports (height: 100dvh) {
      .app {
        width: 100dvw;
        height: 100dvh;
      }

      .app iframe {
        width: 100dvw;
        height: 100dvh;
      }
    }

    /* =====================================================
       PANTALLAS PEQUEÑAS
       ===================================================== */

    @media (max-width: 600px) {
      html,
      body,
      .app,
      .app iframe {
        width: 100%;
        max-width: 100%;
        min-width: 0;
      }

      html,
      body {
        overflow: hidden;
      }

      .app {
        overflow: hidden;
      }

      .app iframe {
        display: block;
        border: 0;
      }
    }

    /* =====================================================
       MODO HORIZONTAL
       ===================================================== */

    @media (orientation: landscape) and (max-height: 500px) {
      .app,
      .app iframe {
        height: 100dvh;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <!--
      ======================================================
      PEGA AQUÍ LA URL DE TU GOOGLE APPS SCRIPT

      Ejemplo:

      https://script.google.com/macros/s/XXXXXXXXXXXX/exec

      IMPORTANTE:
      Debe terminar normalmente en /exec
      ======================================================
    -->

    <iframe
      id="appsScriptFrame"
      src="https://script.google.com/macros/s/AKfycbzUVpJsbtP9bnYVu8Dh8uR54sjQdF1zM8RmfZ_JOrue0tmkPz4dCiR2yjGnq_zqAylL/exec"
      title="Aplicación"
      frameborder="0"
      allow="fullscreen"
      allowfullscreen>
    </iframe>

  </main>

</body>
</html>
